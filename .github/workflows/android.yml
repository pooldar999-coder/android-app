name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "threat-feed.sig" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign threat feed with pinned ECDSA key
        env:
          FEED_SIGNING_KEY_B64: ${{ secrets.PHONEGUARD_FEED_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$FEED_SIGNING_KEY_B64" ]; then
            echo "PHONEGUARD_SIGNING_KEY_READY=false" >> "$GITHUB_ENV"
            echo "::warning::PHONEGUARD_FEED_SIGNING_KEY_B64 is not configured; signed feed and release signing were skipped."
            exit 0
          fi
          printf '%s' "$FEED_SIGNING_KEY_B64" | base64 -d > /tmp/phoneguard-feed-key.pem
          chmod 600 /tmp/phoneguard-feed-key.pem
          echo "PHONEGUARD_SIGNING_KEY_READY=true" >> "$GITHUB_ENV"
          openssl dgst -sha256 -sign /tmp/phoneguard-feed-key.pem -out /tmp/threat-feed.sig.bin threat-feed.json
          base64 -w0 /tmp/threat-feed.sig.bin > threat-feed.sig
          printf '\n' >> threat-feed.sig
          rm -f /tmp/threat-feed.sig.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threat-feed.sig
          if ! git diff --cached --quiet; then
            git commit -m "chore: sign threat feed"
            git push
          fi

      - name: Validate threat feed integrity
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path('threat-feed.json').read_text(encoding='utf-8'))
          assert data.get('schema_version') == 1
          assert isinstance(data.get('version'), int) and data['version'] > 0
          assert isinstance(data.get('updated_at'), int) and data['updated_at'] > 0
          entries = data.get('entries')
          assert isinstance(entries, list) and len(entries) <= 50000
          seen = set()
          for i, item in enumerate(entries):
              h = item.get('sha256', '').lower()
              assert re.fullmatch(r'[0-9a-f]{64}', h), f'invalid SHA-256 at entry {i}'
              assert h not in seen, f'duplicate SHA-256 at entry {i}'
              seen.add(h)
              assert item.get('category') in {'trojan', 'spyware', 'ransomware', 'other'}
              assert item.get('family', '').strip() and item.get('source', '').strip()
              assert item.get('source_url', '').startswith('https://')
              assert item.get('sample_type', '').upper() == 'APK'
          print(f'Validated {len(entries)} threat indicators')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install approved lion launcher artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/phoneguard_lion.jpg.b64 app/src/main/res/drawable-nodpi/phoneguard_lion.jpg
          rm app/src/main/res/drawable-nodpi/phoneguard_lion.jpg.b64
          file app/src/main/res/drawable-nodpi/phoneguard_lion.jpg

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature and package
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.phoneguard.app'"
          sha256sum "$APK"

      - name: Build and sign production release APK
        if: env.PHONEGUARD_SIGNING_KEY_READY == 'true'
        run: |
          gradle --no-daemon assembleRelease
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -s "$UNSIGNED_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign --key /tmp/phoneguard-feed-key.pem --cert phoneguard-release-cert.pem --out app/build/outputs/apk/release/PhoneGuard-release.apk "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/PhoneGuard-release.apk
          "$AAPT" dump badging app/build/outputs/apk/release/PhoneGuard-release.apk | grep -E "^package: name='com.phoneguard.app'"
          sha256sum app/build/outputs/apk/release/PhoneGuard-release.apk
          rm -f /tmp/phoneguard-feed-key.pem

      - name: Upload signed production APK
        if: env.PHONEGUARD_SIGNING_KEY_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-signed-release-apk
          path: app/build/outputs/apk/release/PhoneGuard-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-verified-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
