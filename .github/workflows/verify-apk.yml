name: Verify PhoneGuard Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoneguard-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore launcher artwork
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/phoneguard_lion.jpg.b64 app/src/main/res/drawable-nodpi/phoneguard_lion.jpg
          rm app/src/main/res/drawable-nodpi/phoneguard_lion.jpg.b64
          file app/src/main/res/drawable-nodpi/phoneguard_lion.jpg

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature and application id
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.phoneguard.app'"
          sha256sum "$APK"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-verified-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
